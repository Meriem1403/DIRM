[phases.setup]
nixPkgs = ["php82", "composer", "nodejs-18_x"]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm ci --legacy-peer-deps",
  "npm run build"
]

[phases.build]
cmds = [
  "php bin/console cache:clear --env=prod --no-debug"
]

[start]
cmd = "bash start.sh"
