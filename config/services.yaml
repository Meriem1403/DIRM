# config/services.yaml

# 1) Définition unique de vos paramètres d'application
parameters:
    # chemin où seront déplacés vos fichiers recepisse/note
    notes_directory: '%kernel.project_dir%/public/uploads/notes'

services:
    # 2) Configuration par défaut de vos services
    _defaults:
        autowire: true          # injection automatique
        autoconfigure: true     # enregistrement automatique des tags
        public: false           # services privés par défaut
        # 3) Bind global : tout constructeur qui attend $notesDirectory recevra ce paramètre
        bind:
            $notesDirectory: '%notes_directory%'

    # 4) Enregistrez tout votre code source sous App\
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/*'
            - '../src/Entity/*'
            - '../src/Migrations/*'
            - '../src/Tests/*'
            - '../src/Kernel.php'

    # 5) Spécifique : injection de l'URL MongoDB dans MongoService
    App\Service\MongoService:
        arguments:
            $mongoUrl: '%env(MONGODB_URL)%'
